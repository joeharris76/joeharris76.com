name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  SITE_DEPLOY_TARGET: ${{ vars.SITE_DEPLOY_TARGET }}
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run -s build
      - run: npm run -s check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - name: Stop before deploy when no target is set
        if: env.SITE_DEPLOY_TARGET != 'rehearsal' && env.SITE_DEPLOY_TARGET != 'production'
        run: echo "SITE_DEPLOY_TARGET is '${SITE_DEPLOY_TARGET}': the site built and passed its checks; nothing was deployed." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy and probe
    needs: build
    if: vars.SITE_DEPLOY_TARGET == 'rehearsal' || vars.SITE_DEPLOY_TARGET == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ vars.SITE_ORIGIN }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Probe every legacy path on the deployed origin
        run: npm run -s check:live -- --origin "$SITE_ORIGIN" --window 660
